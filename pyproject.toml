[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dev-scaffold"
version = "1.0.0"
description = "Create consistent PHP or Python project skeletons from the command line"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Joshua Omosa" }]
requires-python = ">=3.9"

[project.scripts]
dev-scaffold = "dev_scaffold:main"

[tool.setuptools]
package-dir = { "" = "src" }
py-modules = ["dev_scaffold"]
